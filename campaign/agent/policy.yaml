# Guardrails for the @swarm_coin agent. Loaded by swarm_social/policy.py.
# Every outgoing text passes check_text(); every action passes the budget.
# VOICE.md explains the reasoning behind each rule.

account: swarm_coin

# Texts containing any of these (case-insensitive, word-boundary) are refused.
banned_phrases:
  - "to the moon"
  - "moon"
  - "pump"
  - "buy now"
  - "buy the dip"
  - "undervalued"
  - "risk-free"
  - "100x"
  - "10x"
  - "price target"
  - "market cap"
  - "don't miss"
  - "last chance"
  - "limited time"
  - "airdrop"
  - "giveaway"
  - "presale"
  - "pre-sale"
  - "ICO"
  - "IDO"
  - "listing soon"
  - "wen listing"
  - "untraceable"
  - "anonymous coin"
  - "100% private"
  - "fully anonymous"
  - "unhackable"
  - "audited"
  - "fair launch"
  - "DM me"
  - "DM us"
  - "send me your seed"
  - "revolutionary"
  - "game-changing"
  - "massive"
  - "huge"
  - "🚀"
  - "💎"
  - "📈"
  # COMMON-RULES section 4 (2026-10-09): never "a copy of Zcash"; say "built on the Zcash stack" or "friendly fork".
  - "copy of Zcash"
  - "Zcash copy"
  - "clone of Zcash"
  - "Zcash clone"
  # never claim anonymity (shielding hides what is written to the chain, nothing more); the words
  # in a history story ("an anonymous letter", "anonymous accounts" in a regulation) stay allowed
  - "anonymous payments"
  - "anonymous payment"
  - "anonymous transactions"
  - "anonymous transaction"
  - "anonymous money"
  - "anonymous chain"
  - "anonymous by default"
  - "is anonymous"
  - "are anonymous"
  - "stay anonymous"
  - "remain anonymous"
  - "you are anonymous"
  - "completely anonymous"
  - "totally anonymous"
  - "full anonymity"
  - "total anonymity"
  - "complete anonymity"
  - "guarantees anonymity"
  # no testnet wording in outward copy
  - "testnet"
  - "test net"
  # NO MULTILEVEL in any marketing; the FUEL levels and the leg leader share never leave the house
  - "multilevel"
  - "multi-level"
  - "MLM"
  - "downline"
  - "upline"
  - "leg leader"
  - "top leader bonus"
  - "referral level"
  - "referral levels"
  # price venues are never named from a project channel
  - "DexScreener"
  - "CoinGecko"
  - "CoinMarketCap"
  - "GeckoTerminal"
  - "Uniswap"
  - "PancakeSwap"
  - "Raydium"

# A dollar/euro figure or a percent gain anywhere in a post is refused.
banned_regex:
  - '[$€£]\s?\d'
  - '\d\s?(usd|eur|usdt|usdc)\b'
  - '\b\d+(\.\d+)?\s?%\s?(gain|up|return|apy|apr|yield)'
  - '\b\d{2,}x\b'
  - '\bguaranteed\s+(returns?|profits?|gains?|income|price|yield)'
  # a token price statement without a currency sign: "SWM trades at 4.15", "the token is worth 2.70 on Base",
  # "the SWM price is now 3.88". A history story may still say "worth 250 dollars in 2001".
  - '(?i)\b(swm|swarm|token|coin|pool|pair|chart|on base|on bsc|bnb smart chain|on solana)\b[^.!?\n]{0,40}?\b(trad(es|ed|ing)|priced?|worth|valued?)\s+(at|around|about|near|roughly|of)?\s*\d'
  - '(?i)\b(trad(es|ed|ing)|priced?|worth|valued?)\s+(at|around|about|near|roughly|of)?\s*\d[^.!?\n]{0,40}?\b(swm|swarm|token|coin|on base|on bsc|bnb smart chain|on solana)\b'
  - '(?i)\b(swm|swarm|token|coin)\b[^.!?\n]{0,30}?\b(price|value)\b[^.!?\n]{0,16}?\d'
  # the retired Solana mint (replaced 2026-10-06 by 9Fyen71zwaRs3QfUCsyUooTAkHfNqzUE17xbXwZL6qiH)
  - '5VXRk8ZDBrPvYrTnJCWSrK1SzaFkgqkXuY6P2VdYJjHJ'
  - '5VXR\w{20,60}JjHJ'

# A token address or mint must have its network named beside it (COMMON-RULES section 4:
# "Name the network beside every number, address and link"). Base and BSC share
# 0xf904C14d21bEF5b8a5345a666C77C9cc2A24043B; the live Solana mint is 9Fyen71z…L6qiH.
address_regex:
  - '0x[0-9a-fA-F]{40}'
  - '\b[1-9A-HJ-NP-Za-km-z]{32,44}\b'
network_names:
  - "on Base"
  - "Base network"
  - "BNB Smart Chain"
  - "on BSC"
  - "on Solana"
  - "Solana mint"
  - "SWARM mainnet"
  - "on mainnet"

# Links refused even on an official host: github.com is for code only, downloads come from
# swarm.green (owner rule 2026-09-28); the testnet explorer never appears in outward copy.
denied_link_regex:
  - '(?i)github\.com/[^\s]*/(releases|download)'
  - '(?i)testnet\.explore\.swarm\.green'

# Every mining call carries the ASIC sentence (COMMON-RULES section 4). Checked on original posts
# and on a calendar post together with its thread and first reply, never on replies. A call is an
# invitation to mine now or an announcement that mining is open; a countdown ("17 days until
# anyone can run a SWARM node") is not.
mining_call_regex:
  - '(?i)\b(public mining (is|has) open|mining (opens|is open|starts|has started|begins) (today|now|from this moment|on \d)|start mining|mine swarm|mine with us|join (the )?(mining|miners)|anyone can mine swarm|miners? (can|may) (start|join))'
mining_call_sentence: "ASICs and rented hash power off the network"

# A mention that asks us to stop is an opt-out (X Automation Rules: honour opt-outs promptly).
# The handle is recorded in state and never answered again until a human removes it.
opt_out_regex:
  - '(?i)\b(stop|unsubscribe|opt[- ]?out|don.?t (reply|answer|respond|tag|mention)|do not (reply|answer|respond|tag|mention)|leave me alone|stop replying|no bot)\b'

# Only these hosts may appear in links.
allowed_link_hosts:
  - swarm.green
  - wallet.swarm.green
  - chat.swarm.green
  - mainnet.explore.swarm.green
  - explore.swarm.green
  - github.com/Swarmcoin
  - x.com/swarm_coin

# The first reply under a story or explainer (`reply:` in the calendar) cites its source and may
# link to any host EXCEPT these: never an exchange, a price page, a chat we do not run, a shortener.
source_link_denied_regex:
  - '(?i)(binance|coinbase|kraken|kucoin|mexc|gate\.io|bybit|okx|bitget|htx\.com|uniswap|dexscreener|dextools)'
  - '(?i)(coingecko|coinmarketcap|coinpaprika|tradingview|livecoinwatch)'
  - '(?i)(t\.me/|telegram\.|discord\.(gg|com)|bit\.ly|tinyurl|t\.co/)'
  - '(?i)(basescan|etherscan|bscscan|solscan)'

# Posts touching these topics must carry one of the disclaimers.
# Word-boundary match: "mined" and "rewarded" do not trigger, "miner" and "rewards" do.
disclaimer_triggers:
  - mining
  - mine
  - miner
  - miners
  - reward
  - rewards
  - waiting list
  - waitlist
  - get SWM
  - earn
  - earning
disclaimers:
  - "No coins are promised."
  - "no coins are promised"
  - "SWM has no guaranteed value"
  - "can lose value"
  - "Mined, not sold."
  - "mined, not sold"

max_post_chars: 280
max_hashtags: 1

# Per-UTC-day caps. The agent's tools refuse once a cap is reached.
budget:
  posts_per_day: 4          # original posts, scheduled ones included
  replies_per_day: 12
  likes_per_day: 5           # likes are only ever queued for a human; X forbids automated likes
  follows_per_day: 0        # following is a human decision
  reposts_per_day: 3
  max_actions_per_run: 8    # one cron cycle
  min_minutes_between_posts: 45
  quiet_hours_utc: [1, 2, 3, 4, 5]   # no original posts in these hours

# Never reply to the same account more than this many times per day.
max_replies_per_account_per_day: 2
# Never reply twice to the same post.
reply_once_per_post: true
# Never reply to posts older than this.
max_reply_age_hours: 36

# Conversations to stay out of entirely (regex on the other post's text).
do_not_engage_regex:
  - '(?i)\b(price|pump|dump|moon|listing|exchange|binance|coinbase|kucoin|mexc|gate\.io)\b'
  - '(?i)\b(giveaway|airdrop|free\s+\w*coins?|send\s+\d)\b'
  - '(?i)\b(scam|rug|ponzi|fraud)\b'
  - '(?i)\b(election|president|trump|biden|putin|israel|gaza|ukraine|war)\b'
  - '(?i)\b(lawsuit|sue|sec\b|regulator|illegal)\b'

# Accounts we never reply to (handles without @).
never_reply_handles: []

# Accounts whose public posts the engagement loop may read and, when relevant, answer.
# Tier 1: ecosystem we build on. Tier 2: privacy advocates and journalists. Tier 3: peers.
# See ../x/engagement-targets.md for the reasoning. Lower-case handles without @.
engagement_targets:
  tier1: [zcash, electriccoinco, zcashfoundation, zingolabs, zooko, zcashcommunity, signalapp, ungoogled]
  # 2026-10-09 (X Engagement Daily verified): eff removed (EFF left X on 9 April 2026); Techlore's handle is techloreinc
  tier2: [naomibrockwell, techloreinc, privacyguides, torproject, sethforprivacy, monerotalk, matt_odell, lopp]
  tier3: [monero, firoorg, zano_project, pirate_chain, beamprivacy, grincoin, railgun_project, secretnetwork]

# Search queries the engagement loop runs each cycle (X recent search syntax).
search_queries:
  - '"swarm_coin" OR "swarm.green" -is:retweet'
  - '"SWARM Messenger" OR "SWARM Browser" OR "SWARM Wallet" -is:retweet'
  - '("privacy coin" OR "shielded transaction" OR "zk-SNARK payments") -is:retweet lang:en'
  - '(ungoogled-chromium wallet) OR ("private messenger" payments) -is:retweet lang:en'
