name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  links:
    name: Markdown links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-all-private --accept 200,204,429 './**/*.md'
          fail: true
