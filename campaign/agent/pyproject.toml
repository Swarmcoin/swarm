[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-social"
version = "0.1.0"
description = "Scheduled posting and guarded, agentic engagement for @swarm_coin on X."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "anthropic>=1.11",
  "tweepy>=4.17",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
swarm-social = "swarm_social.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swarm_social*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
