# @swarm_coin automation. Runs the scheduler (calendar posts whose time has come) and one
# agentic engagement cycle every 30 minutes, then commits the state file so the repository is
# the audit log of everything the account did.
#
# Secrets (Settings → Secrets and variables → Actions):
#   X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET   OAuth 1.0a user context for @swarm_coin
#   X_BEARER_TOKEN                                             optional, app-only reads
#   ANTHROPIC_API_KEY                                          Claude, for the engagement cycle
# Variables (Settings → Secrets and variables → Actions → Variables), set in this order:
#   SWARM_SOCIAL_LIVE           "1" to publish. Anything else = dry run (default). Stage 1: unset or "0".
#   SWARM_SOCIAL_APPROVAL       "review" (default: every reply, like and post is queued for a human) or
#                               "auto" (mention replies go out on their own). Stage 2: "review".
#   SWARM_SOCIAL_X_AI_APPROVAL  reference (date or ticket) of X's written approval for an AI reply bot
#                               (X Automation Rules, April 2026, II.B.3). Stage 3: without it "auto"
#                               is ignored and the run stays in review mode.
#   SWARM_SOCIAL_SCHEDULER      "0" when Metricool publishes the calendar, so posts do not go out twice
#   SWARM_SOCIAL_EFFORT         "medium" (default) | "low" | "high"
#
# The cron only runs on the repository's default branch; until the pull request is merged use
# "Run workflow" on the branch for a manual dry run. Owner steps: campaign/agent/OWNER-SETUP.md.
# Approving queued items: Actions → "Social: X" → Run workflow → approve = "all" or "id1,id2".

name: "Social: X"

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "cycle | post-due | engage | status | queue"
        default: "cycle"
      approve:
        description: "Queue item ids to approve, comma-separated, or 'all'"
        default: ""
      reject:
        description: "Queue item ids to reject, comma-separated, or 'all'"
        default: ""

concurrency:
  group: social-x
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SWARM_SOCIAL_LIVE: ${{ vars.SWARM_SOCIAL_LIVE }}
      SWARM_SOCIAL_APPROVAL: ${{ vars.SWARM_SOCIAL_APPROVAL || 'review' }}
      SWARM_SOCIAL_X_AI_APPROVAL: ${{ vars.SWARM_SOCIAL_X_AI_APPROVAL }}
      SWARM_SOCIAL_SCHEDULER: ${{ vars.SWARM_SOCIAL_SCHEDULER || '1' }}
      SWARM_SOCIAL_EFFORT: ${{ vars.SWARM_SOCIAL_EFFORT || 'medium' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: campaign/agent/pyproject.toml
      - name: Install
        run: pip install -q -e campaign/agent
      - name: Tests (guardrails must hold before anything is sent)
        run: cd campaign/agent && python -m pytest -q
      - name: Approve or reject queued items
        if: github.event_name == 'workflow_dispatch' && (inputs.approve != '' || inputs.reject != '')
        run: |
          if [ -n "${{ inputs.reject }}" ]; then
            if [ "${{ inputs.reject }}" = "all" ]; then swarm-social reject --all; else swarm-social reject $(echo "${{ inputs.reject }}" | tr ',' ' '); fi
          fi
          if [ -n "${{ inputs.approve }}" ]; then
            if [ "${{ inputs.approve }}" = "all" ]; then swarm-social approve --all; else swarm-social approve $(echo "${{ inputs.approve }}" | tr ',' ' '); fi
          fi
      - name: Run
        if: github.event_name == 'schedule' || (inputs.approve == '' && inputs.reject == '')
        run: swarm-social ${{ inputs.command || 'cycle' }}
      - name: Step summary
        if: always()
        run: |
          swarm-social report >/dev/null || true
          cat campaign/agent/state/last-run.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Commit state
        if: always()
        run: |
          git config user.name "swarm-social[bot]"
          git config user.email "swarmofficial@atomicmail.io"
          git add campaign/agent/state
          git diff --cached --quiet || git commit -m "social: state after $(date -u +%Y-%m-%dT%H:%MZ) run"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push failed; state is in the step summary"
